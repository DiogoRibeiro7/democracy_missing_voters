name: Notebook

on:
  push:
  pull_request:

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run tests
        run: pytest
      - name: Execute notebook
        run: python scripts/run_notebook.py
      - name: Check expected outputs
        run: |
          test -f figures/figure_1_portugal_turnout_1975_2025.png
          test -f figures/figure_2_portugal_2025_voters_vs_nonvoters.png
          test -f figures/figure_3_portugal_2025_abstention_geography.png
          test -f figures/figure_4_oecd_trust_voice_gap.png
          test -f data/processed/notebook_validation_report.csv
          test -f data/source_provenance.csv
      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: notebook-figures
          path: figures/*.png
